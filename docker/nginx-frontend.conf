server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # 1. Proxy API calls to backend container app in the same Azure Container App environment
    location /api/ {
        proxy_pass http://tattva-backend;
        proxy_set_header Host tattva-backend.internal.livelycliff-59816b1f.eastasia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;

        # WebSocket support for realtime updates / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # 2. Proxy health check directly
    location = /health {
        proxy_pass http://tattva-backend;
        proxy_set_header Host tattva-backend.internal.livelycliff-59816b1f.eastasia.azurecontainerapps.io;
    }

    # 3. Static assets with cache headers
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_astro/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. React Clinical SPA routes
    location ~ ^/(dashboard|documents|examinations|patients|doctors|organizations|allergies|biomarkers|analytics|calendar|notifications|catalogs|settings|task-monitor|login|setup) {
        root /usr/share/nginx/html;
        try_files $uri /app.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 5. Native Astro Landing Page & Marketing routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /app.html;
    }
}
